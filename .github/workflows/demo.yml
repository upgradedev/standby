name: Standby demo production
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Legacy demo or sealed pitch scene review without app/voice access
        required: false
        default: legacy
        type: choice
        options: [legacy, pitch-scenes, pitch-take1, pitch-take2, pitch-take3, pitch-take4, pitch-spent4, pitch-instrument]
      url:
        description: Verified public AWS application
        required: true
        type: string
      release:
        description: Full frozen application commit SHA
        required: true
        type: string
      voice_sha256:
        description: SHA256 of the bounded original narration ZIP
        required: false
        default: ''
        type: string
      project_asset_id:
        description: Own-repository draft asset ID for sealed scene-only workspace
        required: false
        default: ''
        type: string
      project_sha256:
        description: Exact SHA256 of sealed scene-only project ZIP
        required: false
        default: ''
        type: string
      reuse_run_id:
        description: Optional previous demo run whose captured beats should be reused
        required: false
        default: ''
        type: string
      beat:
        description: Capture all beats, one replacement beat, or render existing captures
        default: all
        type: choice
        options: [all, overview, history, baseline, proposal, unavailable, provenance, render-only]
permissions:
  contents: read
  actions: read
jobs:
  request:
    runs-on: ubuntu-latest
    steps:
      - name: Validate mode and its bounded input contract
        env:
          MODE: ${{ inputs.mode || 'legacy' }}
          URL: ${{ inputs.url }}
          RELEASE: ${{ inputs.release }}
          VOICE_SHA256: ${{ inputs.voice_sha256 }}
          PROJECT_ASSET_ID: ${{ inputs.project_asset_id }}
          PROJECT_SHA256: ${{ inputs.project_sha256 }}
          REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
        run: |
          python - <<'PY'
          import os,re
          mode=os.environ['MODE']
          assert mode in ['legacy','pitch-scenes','pitch-take1','pitch-take2','pitch-take3','pitch-take4','pitch-spent4','pitch-instrument'], 'Unknown mode must fail closed'
          assert os.environ['URL'].rstrip('/')=='https://d34x1513u5u1qs.cloudfront.net'
          assert re.fullmatch('[a-f0-9]{40}',os.environ['RELEASE'])
          if mode=='legacy':
              assert re.fullmatch('[a-f0-9]{64}',os.environ['VOICE_SHA256'])
          else:
              assert re.fullmatch('[1-9][0-9]{0,19}',os.environ['PROJECT_ASSET_ID'])
              assert re.fullmatch('[a-f0-9]{64}',os.environ['PROJECT_SHA256'])
          if mode=='pitch-spent4':
              assert os.environ['REUSE_RUN_ID']=='41421976953', 'Only pinned spentTake4 is accepted'
              assert os.environ['PROJECT_ASSET_ID']=='701225506'
              assert os.environ['PROJECT_SHA256']=='d72d88b61ca4d74448acc36d6405f4701b829880fae5286ea7e21de47133dd20'
              assert os.environ['RELEASE']=='db67b6d0a2455549736be0d6574c184309fe0277'
          if mode=='pitch-instrument' and os.environ['REUSE_RUN_ID']:
              assert re.fullmatch('[1-9][0-9]{0,19}',os.environ['REUSE_RUN_ID'])
          print('Validated mode-specific request; no app or voice call.')
          PY
  record:
    needs: request
    if: ${{ inputs.mode == '' || inputs.mode == 'legacy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Provision media tools in hosted CI only
        run: |
          if ! command -v ffmpeg; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
      - name: Fetch original narration from the exact temporary private URL
        env:
          VOICE_ARCHIVE_URL: ${{ secrets.STANDBY_VOICE_ARCHIVE_URL }}
          VOICE_SHA256: ${{ inputs.voice_sha256 }}
        run: |
          python - <<'PY'
          import hashlib,io,os,pathlib,urllib.request,zipfile
          raw=urllib.request.urlopen(os.environ['VOICE_ARCHIVE_URL'],timeout=30).read()
          assert hashlib.sha256(raw).hexdigest()==os.environ['VOICE_SHA256']
          expected={x+'.mp3' for x in ['overview','history','baseline','proposal','unavailable','provenance']}
          archive=zipfile.ZipFile(io.BytesIO(raw))
          assert set(archive.namelist())==expected and sum(x.file_size for x in archive.infolist())<10000000
          out=pathlib.Path('.runtime/voice');out.mkdir(parents=True)
          for name in sorted(expected): (out/name).write_bytes(archive.read(name))
          print('Verified six original narration files.')
          PY
      - name: Restore only this repository's retained demo captures
        if: ${{ inputs.reuse_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
        run: |
          python - <<'PY'
          import os,re,subprocess
          run=os.environ['REUSE_RUN_ID'];assert re.fullmatch(r'[0-9]{1,20}',run)
          subprocess.run(['gh','run','download',run,'--repo','upgradedev/standby','--name','standby-demo-captures','--dir','.runtime/demo'],check=True)
          PY
      - name: Record actual frozen app interactions
        id: capture
        if: ${{ inputs.beat != 'render-only' }}
        env:
          STANDBY_DEMO_URL: ${{ inputs.url }}
          STANDBY_DEMO_RELEASE: ${{ inputs.release }}
          STANDBY_DEMO_BEAT: ${{ inputs.beat }}
        run: |
          if [ "$STANDBY_DEMO_BEAT" = all ]; then
            node tools/demo/record.mjs --out .runtime/demo --beat all --skip-existing
          else
            node tools/demo/record.mjs --out .runtime/demo --beat "$STANDBY_DEMO_BEAT" --replace
          fi
      - name: Preserve completed captures before rendering
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: standby-demo-captures
          retention-days: 3
          include-hidden-files: true
          path: .runtime/demo/
      - name: Render and verify actual media bytes
        env:
          STANDBY_DEMO_RELEASE: ${{ inputs.release }}
        run: python tools/demo/render.py --capture .runtime/demo --voice-dir .runtime/voice --release "$STANDBY_DEMO_RELEASE"
      - uses: actions/upload-artifact@v4
        with:
          name: standby-public-demo
          retention-days: 21
          include-hidden-files: true
          path: |
            .runtime/demo/standby-demo.mp4
            .runtime/demo/captions.srt
            .runtime/demo/verification.json
            .runtime/demo/project.json
  pitch_project:
    needs: request
    if: ${{ inputs.mode == 'pitch-scenes' || inputs.mode == 'pitch-take1' || inputs.mode == 'pitch-take2' || inputs.mode == 'pitch-take3' || inputs.mode == 'pitch-take4' || inputs.mode == 'pitch-spent4' || inputs.mode == 'pitch-instrument' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # GitHub requires push access to read unpublished draft release assets.
      # This job only verifies/extracts bytes; it never executes the scene package.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download only the sealed scene project from this repository
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_ASSET_ID: ${{ inputs.project_asset_id }}
          PROJECT_SHA256: ${{ inputs.project_sha256 }}
          RELEASE: ${{ inputs.release }}
          PROJECT_MODE: ${{ inputs.mode == 'pitch-scenes' && 'scenes' || (inputs.mode == 'pitch-take4' || inputs.mode == 'pitch-spent4') && 'take4' || inputs.mode == 'pitch-take3' && 'take3' || inputs.mode == 'pitch-take2' && 'take2' || 'take1' }}
        run: |
          python tools/pitch/download-project.py --help
          python tools/pitch/download-project.py --asset-id "$PROJECT_ASSET_ID" --sha256 "$PROJECT_SHA256" --release "$RELEASE" --mode "$PROJECT_MODE" --out "$RUNNER_TEMP/standby-pitch"
      - uses: actions/upload-artifact@v4
        with:
          name: standby-pitch-verified-project
          retention-days: 3
          path: ${{ runner.temp }}/standby-pitch/
  pitch_scenes:
    needs: [request, pitch_project]
    if: ${{ inputs.mode == 'pitch-scenes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: standby-pitch-verified-project
          path: ${{ runner.temp }}/standby-pitch/
      - name: Install pinned media dependencies in hosted CI only
        run: |
          npm ci
          npx playwright install --with-deps chromium
          if ! command -v ffmpeg; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
      - name: Review deterministic scenes without app, voice or external browser requests
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright
        run: |
          node tools/pitch/scene-review.mjs --help
          node tools/pitch/scene-review.mjs --project "$RUNNER_TEMP/standby-pitch"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: standby-pitch-scene-review
          retention-days: 21
          path: ${{ runner.temp }}/standby-pitch/out/scene-review/
  pitch_take1:
    needs: [request, pitch_project]
    if: ${{ inputs.mode == 'pitch-take1' || inputs.mode == 'pitch-take2' || inputs.mode == 'pitch-take3' || inputs.mode == 'pitch-take4' || inputs.mode == 'pitch-spent4' || inputs.mode == 'pitch-instrument' }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: standby-pitch-verified-project
          path: ${{ runner.temp }}/standby-pitch/
      - name: Install pinned capture dependencies in hosted CI only
        run: |
          npm ci
          npx playwright install --with-deps chromium
          if ! command -v ffmpeg; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
      - uses: actions/download-artifact@v4
        if: ${{ (inputs.mode == 'pitch-instrument' && inputs.reuse_run_id != '') || inputs.mode == 'pitch-spent4' }}
        with:
          name: ${{ inputs.mode == 'pitch-spent4' && 'standby-pitch-take4' || 'standby-pitch-take1' }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.reuse_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/standby-spent/
      - name: Offline instrument rehearsal or the single specifically approved take
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright
          CI: 'true'
          CAPTURE_MODE: ${{ inputs.mode }}
        run: |
          python tools/pitch/capture-take.py --help
          if [ "$CAPTURE_MODE" = pitch-spent4 ]; then
            python tools/pitch/capture-take.py --project "$RUNNER_TEMP/standby-pitch" --take 4 --instrument-only
          elif [ "$CAPTURE_MODE" = pitch-instrument ]; then
            python tools/pitch/capture-take.py --project "$RUNNER_TEMP/standby-pitch" --instrument-only
          elif [ "$CAPTURE_MODE" = pitch-take4 ]; then
            python tools/pitch/capture-take.py --project "$RUNNER_TEMP/standby-pitch" --take 4
          elif [ "$CAPTURE_MODE" = pitch-take3 ]; then
            python tools/pitch/capture-take.py --project "$RUNNER_TEMP/standby-pitch" --take 3
          elif [ "$CAPTURE_MODE" = pitch-take2 ]; then
            python tools/pitch/capture-take.py --project "$RUNNER_TEMP/standby-pitch" --take 2
          else
            python tools/pitch/capture-take.py --project "$RUNNER_TEMP/standby-pitch"
          fi
      - name: Review only already-spent source windows
        if: ${{ (inputs.mode == 'pitch-instrument' && inputs.reuse_run_id != '') || inputs.mode == 'pitch-spent4' }}
        run: |
          python tools/pitch/review-spent.py --help
          python tools/pitch/review-spent.py --project "$RUNNER_TEMP/standby-pitch" --capture "$RUNNER_TEMP/standby-spent" --out "$RUNNER_TEMP/standby-pitch/out/spent-review" --take "${{ inputs.mode == 'pitch-spent4' && '4' || '1' }}"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && ((inputs.mode == 'pitch-instrument' && inputs.reuse_run_id != '') || inputs.mode == 'pitch-spent4') }}
        with:
          name: standby-pitch-spent-review
          retention-days: 21
          path: ${{ runner.temp }}/standby-pitch/out/spent-review/
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: ${{ inputs.mode == 'pitch-spent4' && 'standby-pitch-spent-instrument4' || inputs.mode == 'pitch-take4' && 'standby-pitch-take4' || inputs.mode == 'pitch-take3' && 'standby-pitch-take3' || inputs.mode == 'pitch-take2' && 'standby-pitch-take2' || 'standby-pitch-take1' }}
          retention-days: 7
          path: ${{ runner.temp }}/standby-pitch/out/take${{ (inputs.mode == 'pitch-take4' || inputs.mode == 'pitch-spent4') && '4' || inputs.mode == 'pitch-take3' && '3' || inputs.mode == 'pitch-take2' && '2' || '1' }}/
