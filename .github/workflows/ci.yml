name: Standby CI
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: |
          if test -f package-lock.json; then npm ci; else npm install; fi
          python -m pip install --disable-pip-version-check boto3==1.43.103
      - name: Offline source and domain checks
        run: |
          npm run check:secrets
          npm run typecheck
          npm test
          python docs/research/standby-evidence/retrieve.py --validate
          python docs/research/standby-evidence/verify_retrieval.py
          python -m unittest discover -s tools/data -p 'test_*.py'
          python -m unittest discover -s tools -p 'test_build_matrix.py'
          python -m unittest discover -s tools/demo -p 'test_*.py'
          node --test tools/demo/*.test.mjs
          node --test tests/browser/map-render-proof.test.mjs
      - name: Build application and isolated Lambda bundles
        run: npm run build
      - name: Install preview browser in hosted CI only
        run: npx playwright install --with-deps chromium
      - name: Shell and overview owner-review preview
        run: |
          node tools/console-preview/shoot.mjs --help
          node tools/console-preview/lint_ui.mjs --help
          node tools/console-preview/preview.mjs --help
          node tools/console-preview/preview.mjs --source "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: standby-console-preview
          path: .runtime/console-preview/
          retention-days: 3
      - name: Package original software only
        run: |
          mkdir release
          for name in read writer retention; do (cd dist/$name && zip -q ../../release/$name.zip index.js); done
          cp -R apps/console/dist release/web
          cp package-lock.json release/
      - uses: actions/upload-artifact@v4
        with:
          name: standby-release
          path: release/
          retention-days: 3
