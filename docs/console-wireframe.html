<!--
  Console wireframe (low fidelity)

  Purpose: agree the information architecture with the user before any code.
  It shows which areas exist, what each page holds, who sees what, and the
  standard name of each part. It is not a visual design.

  How to use: edit the JSON in the next script tag, save, and reload the file.
  It needs no network and no build step. Open it straight from disk.

  Config fields
    appName          Name shown in the top bar.
    statuses         The status lists, one per entity: { "<entity>": ["New", ...], ... }.
                     A plain array is one list for every table. Tables, filters and
                     badges read these lists; never show one entity's statuses on another.
    roles[]          { id, label, permissions: ["area.read", "area.action", ...] }.
                     "*" grants everything. Use .read for seeing an area, as the starter does.
    nav[]            { id, label, icon, badge?, permission? }. id is also the key in pages,
                     and later the URL path and the nav-<id> test id, so name it after
                     the noun in the label ("orders", not "records").
                     icon is an icon name (for example from lucide); the wireframe
                     shows a placeholder box with the name as a tooltip.
    pages.<navId>    { title, actions?: [action], sections: [section] }
    section types
      kpis           { items: [{ label, value, note, link?, filter? }] }
                     link: nav id to drill into. filter: the filter it sets there, for
                     example { "Status": "New" }; the label should equal that value.
      chart          { title, bars }
      filters        { fields: ["Search", "Status", ...] }
      table          { title?, columns: [...], rows, drawer?: "<drawer id>",
                       statuses?: "<entity>", paging?: "offset" or "cursor", total? }
                     statuses: the list the Status column uses (default: the first).
                     paging "cursor" shows "Page 1" and Next with no total, because a
                     cursor-paged list cannot count; "offset" shows "1-10 of <total>".
      queue          { tabs: [{ label, count }], itemLabel, items, actions: [action] }
      form           { title, fields: [{ label, type, required?, hint?, options? }], submit: action }
      note           { text }
      Any section can carry "permission" to hide it from roles without it.
    drawers.<id>     { title, tabs: [...], actions: [action] }
    action           { label, permission?, confirm?: true or "question text", reason?: true, danger? }
                     reason: the confirm dialog asks for a required reason.
                     A role that sees the section but lacks the action's permission
                     sees the action disabled, with the roles that may use it. The
                     "Who sees what" panel lists areas and actions.
-->

    config = normalize(JSON.parse(document.getElementById('wireframe-config').textContent));
  } catch (err) {
    var box = document.createElement('div');
    box.className = 'wf-error';
    box.textContent = 'The config JSON at the top of this file has an error: ' + (err && err.message ? err.message : String(err));
    document.body.insertBefore(box, document.body.firstChild);
    return;
  }

  var adminRole = config.roles.filter(function (r) { return r.permissions.indexOf('*') >= 0; })[0];
  var state = {
    page: (location.hash || '').replace(/^#/, '') || (config.nav[0] && config.nav[0].id) || '',
    width: 1440,
    role: (adminRole || config.roles[config.roles.length - 1] || { id: '' }).id,
    data: 'ok',
    callouts: true,
    collapsed: false,
    navOpen: false,
    drawer: null,
    drawerTab: 0,
    queueTab: 0,
    dialog: null,
    toast: '',
    formErrors: {},
    filter: null,
    returnFocus: null,
    focusNext: null
  };
  var toastTimer = 0;

  function normalize(c) {
    c = c || {};
    return {
      appName: String(c.appName || 'Console'),
      statuses: normalizeStatuses(c.statuses),
      roles: (Array.isArray(c.roles) && c.roles.length ? c.roles : [{ id: 'admin', label: 'Admin', permissions: ['*'] }]).map(function (r) {
        return { id: String(r.id), label: String(r.label || r.id), permissions: Array.isArray(r.permissions) ? r.permissions.map(String) : [] };
      }),
      nav: (Array.isArray(c.nav) ? c.nav : []).map(function (n) {
        return { id: String(n.id), label: String(n.label || n.id), icon: String(n.icon || ''), badge: n.badge, permission: n.permission || '' };
      }),
      pages: c.pages && typeof c.pages === 'object' ? c.pages : {},
      drawers: c.drawers && typeof c.drawers === 'object' ? c.drawers : {}
    };
  }

  // One list per entity. A plain array becomes the list "default".
  function normalizeStatuses(value) {
    var lists = {};
    if (Array.isArray(value) && value.length) lists['default'] = value.map(String);
    else if (value && typeof value === 'object') {
      Object.keys(value).forEach(function (k) {
        if (Array.isArray(value[k]) && value[k].length) lists[k] = value[k].map(String);
      });
    }
    if (Object.keys(lists).length === 0) lists['default'] = ['Open', 'In progress', 'Done'];
    return lists;
  }
  function statusList(name) {
    return config.statuses[name] || config.statuses[Object.keys(config.statuses)[0]];
  }
  function rolesWith(permission) {
    return config.roles.filter(function (r) { return can(r, permission); }).map(function (r) { return r.label; });
  }
  function filterText(filter) {
    return filter ? Object.keys(filter).map(function (k) { return k + ': ' + filter[k]; }).join(', ') : '';
  }

  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }
  function currentRole() {
    return config.roles.filter(function (r) { return r.id === state.role; })[0] || null;
  }
  function can(role, permission) {
    if (!role) return false;
    if (!permission) return true;
    return role.permissions.indexOf('*') >= 0 || role.permissions.indexOf(permission) >= 0;
  }
  function size() {
    return state.width < 768 ? 'sm' : state.width < 1200 ? 'md' : 'lg';
  }
  function navById(id) {
    return config.nav.filter(function (n) { return n.id === id; })[0] || null;
  }
  function drawerDef(ref) {
    if (!ref) return null;
    if (typeof ref === 'string') return config.drawers[ref] ? Object.assign({ id: ref }, config.drawers[ref]) : { id: ref, title: ref, tabs: ['Summary'] };
    return ref;
  }
  function idPrefix(label) {
    return String(label || 'ID').replace(/[^A-Za-z]/g, '').slice(0, 3).toUpperCase() || 'ID';
  }
  function ph(width) {
    return '<span class="ph" style="width:' + width + 'px"></span>';
  }

  // ---------------------------------------------------------------- render

  function render() {
    whyCount = 0;
    var role = currentRole();
    var visibleNav = role ? config.nav.filter(function (n) { return can(role, n.permission); }) : [];
    if (role && !visibleNav.some(function (n) { return n.id === state.page; })) {
      state.page = visibleNav[0] ? visibleNav[0].id : '';
      state.drawer = null;
    }
    var sz = size();
    app.setAttribute('data-size', sz);
    app.setAttribute('data-collapsed', String(sz !== 'sm' && state.collapsed));
    app.setAttribute('data-navopen', String(sz === 'sm' && state.navOpen));
    app.setAttribute('data-drawer', String(Boolean(state.drawer)));
    app.setAttribute('data-callouts', state.callouts ? 'on' : 'off');
    app.innerHTML = topbar(role) + sidebar(role, visibleNav, sz) +
      '<button type="button" class="scrim" data-do="scrim" aria-label="Close" tabindex="-1"></button>' +
      mainArea(role) + drawerHtml(role) + dialogHtml() + toastHtml();
    var visible = applyCallouts();
    renderLegend(visible);
    fit();
    if (state.focusNext) {
      var candidates = app.querySelectorAll(state.focusNext);
      state.focusNext = null;
      for (var c = 0; c < candidates.length; c += 1) {
        if (isVisible(candidates[c])) { candidates[c].focus(); break; }
      }
    }
  }

  function topbar(role) {
    return '<header class="topbar" data-callout="topbar">' +
      '<button type="button" class="menu-btn" data-do="menu" aria-label="Open navigation" data-callout="menu-button"><span class="bar"></span><span class="bar"></span><span class="bar"></span></button>' +
      '<div class="brand">' + esc(config.appName) + '</div>' +
      (state.page === 'capacity' ? '<span class="badge" aria-label="Assumption-based scenario">Assumption-based scenario</span>' : '') +
      (role ? '<div class="search" data-callout="search"><input id="wf-search" type="search" placeholder="Search (press /)" aria-label="Search"></div>' : '') +
      '<div class="top-actions"><button type="button" class="btn top-hide-sm" data-do="theme">Theme</button>' +
      '<span class="avatar" title="Account menu (a user icon, not initials: see layout-shell.md)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></span></div>' +
      '</header>';
  }

  function sidebar(role, items, sz) {
    if (!role) return '<nav class="sidebar" aria-label="Main"></nav>';
    var term = sz === 'sm' ? 'sidebar' : state.collapsed ? 'rail' : 'sidebar';
    var html = '<nav class="sidebar" aria-label="Main" data-callout="' + term + '">';
    items.forEach(function (n) {
      var current = n.id === state.page;
      html += '<button type="button" class="nav-item" data-do="nav" data-id="' + esc(n.id) + '" data-testid="nav-' + esc(n.id) + '"' +
        (current ? ' aria-current="page"' : '') + ' title="' + esc(n.label) + '">' +
        '<span class="ico" title="icon: ' + esc(n.icon || 'none') + '">' + esc((n.icon || n.label).charAt(0).toUpperCase()) + '</span>' +
        '<span class="nav-label">' + esc(n.label) + '</span>' +
        (n.badge != null && n.badge !== '' ? '<span class="badge"><span class="nav-label">' + esc(n.badge) + '</span></span>' : '') +
        '</button>';
    });
    html += '<div class="side-foot"><button type="button" class="collapse-btn" data-do="collapse">' + (state.collapsed ? 'Expand' : 'Collapse') + '</button></div>';
    return html + '</nav>';
  }

  function mainArea(role) {
    if (!role) {
      return '<main class="main" id="wf-main"><div class="state" data-callout="state"><b>Sign in required</b>' +
        '<span>No session means no data and no default role. The app fails closed.</span>' +
        '<button type="button" class="btn primary">Sign in</button></div></main>';
    }
    var nav = navById(state.page);
    var page = config.pages[state.page] || { title: nav ? nav.label : 'Not found', sections: [{ type: 'note', text: 'No page config for "' + state.page + '". Add it under pages in the JSON.' }] };
    var title = page.title || (nav ? nav.label : state.page);
    var actions = (page.actions || []).map(function (a) { return actionButton(role, a, 'page'); }).join('');
    var html = '<main class="main" id="wf-main">' +
      '<div class="page-header" data-callout="page-header"><div><div class="crumb">' + esc(config.appName) + ' / ' + esc(title) + (state.filter ? ' / ' + esc(filterText(state.filter)) : '') + '</div><h1>' + esc(title) + '</h1></div>' +
      (actions ? '<div class="page-actions">' + actions + '</div>' : '') + '</div>';
    var sections = (page.sections || []).filter(function (s) { return can(role, s.permission); });
    var hasData = sections.some(function (s) { return ['kpis', 'chart', 'table', 'queue'].indexOf(s.type) >= 0; });
    if (state.data === 'unavailable' && hasData) {
      html += '<div class="banner" data-callout="banner"><b>Data source not connected.</b> This page shows what it can and marks the rest as unavailable.</div>';
    }
    sections.forEach(function (s, i) { html += section(role, s, i); });
    return html + '</main>';
  }

  function stateBlock(kind, what) {
    if (kind === 'loading') {
      return '<div class="skel" data-callout="state" aria-label="Loading">' + '<span></span><span style="width:85%"></span><span style="width:70%"></span><span style="width:90%"></span>' + '</div>';
    }
    var t = STATE_TEXT[kind];
    return '<div class="state" data-callout="state"><b>' + esc(t[0]) + (what ? ': ' + esc(what) : '') + '</b><span>' + esc(t[1]) + '</span>' +
      (kind === 'error' ? '<button type="button" class="btn">Retry</button>' : '') +
      (kind === 'empty' ? '<button type="button" class="btn">Create the first one</button>' : '') + '</div>';
  }

  function section(role, s, index) {
    var dataState = state.data;
    switch (s.type) {
      case 'kpis':
        return '<div class="kpis">' + (s.items || []).map(function (k) {
          var value = dataState === 'ok' ? k.value : dataState === 'loading' ? '' : '-';
          var note = dataState === 'ok' ? k.note : dataState === 'loading' ? '' : STATE_TEXT[dataState][0];
          var target = k.link ? navById(k.link) : null;
          var attrs = k.link
            ? ' data-do="nav" data-id="' + esc(k.link) + '"' + (k.filter ? ' data-filter="' + esc(JSON.stringify(k.filter)) + '"' : '') +
              ' title="Opens ' + esc(target ? target.label : k.link) + (k.filter ? ' filtered by ' + esc(filterText(k.filter)) : '') + '"'
            : '';
          return '<button type="button" class="kpi" data-callout="kpi"' + attrs + '>' +
            '<div class="kpi-label">' + esc(k.label) + '</div>' +
            '<div class="kpi-value">' + (dataState === 'loading' ? ph(70) : esc(value)) + '</div>' +
            '<div class="kpi-note">' + (dataState === 'loading' ? ph(110) : esc(note || '')) + '</div></button>';
        }).join('') + '</div>';
      case 'chart': {
        var body;
        if (dataState !== 'ok') body = stateBlock(dataState, s.title);
        else {
          var bars = '';
          for (var b = 0; b < (s.bars || 12); b += 1) bars += '<span style="height:' + (25 + ((b * 37) % 70)) + '%"></span>';
          body = '<div class="chart" aria-hidden="true">' + bars + '</div>';
        }
        return '<section class="card" data-callout="chart"><div class="card-head">' + esc(s.title || 'Chart') + '</div>' + body + '</section>';
      }
      case 'filters':
        return '<div class="filters" data-callout="filters">' + (s.fields || []).map(function (f) {
          var active = state.filter && state.filter[f] != null;
          return '<div class="filter' + (/search/i.test(f) ? ' wide' : '') + (active ? ' on' : '') + '">' + esc(f) + (active ? ': ' + esc(state.filter[f]) : '') + (/search/i.test(f) ? '' : ' &#9662;') + '</div>';
        }).join('') + (state.filter ? '<button type="button" class="btn" data-do="clear-filter">Clear filters</button>' : '') + '</div>';
      case 'table':
        return tableHtml(s, index);
      case 'queue':
        return queueHtml(role, s);
      case 'form':
        return formHtml(role, s, index);
      case 'map':
        return '<section class="card"><div class="card-head">' + esc(s.title || 'Map region') + '</div><div class="wf-map-placeholder"><b>Full map region</b><span>Selected modeled location: latitude / longitude</span><small>Approximate zone representative, not an insured address</small></div><p class="note">' + esc(s.text || '') + '</p></section>';
      case 'timeline':
        return '<section class="card"><div class="card-head">' + esc(s.title || 'Time bars') + '</div><div class="wf-time-placeholder"><label>Selected minute <input type="range" min="0" max="480" value="0" aria-label="Illustrative selected scenario minute"></label><p>Arrivals <span></span></p><p>Queued jobs <span></span></p><p>Available capabilities <span></span></p></div><p class="note">' + esc(s.text || '') + '</p></section>';
      case 'note':
        return '<p class="note">' + esc(s.text || '') + '</p>';
      default:
        return '<p class="note">Unknown section type "' + esc(s.type) + '".</p>';
    }
  }

  function cell(col, r, statusIndex, list) {
    if (/status/i.test(col)) {
      return '<span class="status"' + (statusIndex === 0 ? ' data-callout="status-badge"' : '') + '>' + esc(list[r % list.length]) + '</span>';
    }
    return ph(40 + ((r * 13 + col.length * 7) % 60));
  }

  function tableHtml(s, index) {
    var cols = s.columns || ['ID', 'Name', 'Status'];
    var rows = s.rows || 5;
    var drawer = drawerDef(s.drawer);
    var head = s.title ? '<div class="card-head">' + esc(s.title) + '</div>' : '';
    if (state.data !== 'ok') return '<section class="card" data-callout="table">' + head + '<div style="padding:12px">' + stateBlock(state.data, s.title || cols[0]) + '</div></section>';
    var prefix = idPrefix(cols[0]);
    var list = statusList(s.statuses);
    var statusSeen = 0;
    var trs = '';
    var cards = '';
    for (var r = 0; r < rows; r += 1) {
      var id = prefix + '-' + (1040 + r);
      var key = index + ':' + r;
      var open = drawer ? ' class="clickable" tabindex="0" data-do="open-row" data-key="' + key + '" data-rowid="' + id + '"' : '';
      trs += '<tr' + open + '>' + cols.map(function (c, ci) {
        if (ci === 0) return '<td><b>' + esc(id) + '</b></td>';
        var html = cell(c, r, /status/i.test(c) ? statusSeen++ : -1, list);
        return '<td>' + html + '</td>';
      }).join('') + '</tr>';
      var statusCol = cols.filter(function (c) { return /status/i.test(c); })[0];
      cards += '<' + (drawer ? 'button type="button" data-do="open-row" data-key="' + key + '" data-rowid="' + id + '"' : 'div') + ' class="mcard">' +
        '<div class="mcard-top"><b>' + esc(id) + '</b>' + (statusCol ? '<span class="status">' + esc(list[r % list.length]) + '</span>' : '') + '</div>' +
        ph(160) + ph(110) + '</' + (drawer ? 'button' : 'div') + '>';
    }
    return '<section class="card" data-callout="table">' + head +
      '<div class="table-wrap"><table class="data"><thead><tr>' + cols.map(function (c, ci) {
        return '<th scope="col">' + esc(c) + (ci === 0 ? ' <span class="sort">&#8595;</span>' : '') + '</th>';
      }).join('') + '</tr></thead><tbody>' + trs + '</tbody></table></div>' +
      '<div class="mcards">' + cards + '</div>' +
      (s.paging === 'cursor'
        ? '<div class="pagination" data-callout="pagination"><span class="pg-count">Page 1 (cursor paging: no total)</span>' +
          '<button type="button" class="btn" aria-disabled="true">Prev</button><button type="button" class="btn">Next</button></div>'
        : '<div class="pagination" data-callout="pagination"><span class="pg-count">1-' + rows + ' of ' + esc(s.total != null ? s.total : 240) + '</span>' +
          '<button type="button" class="btn" aria-disabled="true">Prev</button><button type="button" class="btn">Next</button></div>') + '</section>';
  }

  function queueHtml(role, s) {
    var tabs = s.tabs || [{ label: 'Pending', count: 3 }];
    var tabRow = '<div class="tabs" role="tablist" data-callout="tabs">' + tabs.map(function (t, i) {
      return '<button type="button" class="tab" role="tab" aria-selected="' + (i === state.queueTab) + '" data-do="queue-tab" data-index="' + i + '">' +
        esc(t.label) + (t.count != null ? '<span class="count">' + esc(t.count) + '</span>' : '') + '</button>';
    }).join('') + '</div>';
    var body;
    if (state.data !== 'ok') body = '<div style="padding:12px">' + stateBlock(state.data, s.itemLabel) + '</div>';
    else {
      var items = '';
      for (var i = 0; i < (s.items || 3); i += 1) {
        var acts = state.queueTab === 0 ? (s.actions || []).map(function (a) { return actionButton(role, a, (s.itemLabel || 'Item') + ' #' + (201 + i)); }).join('') : '<span class="status">' + esc(tabs[state.queueTab].label) + '</span>';
        items += '<li><div class="q-main"><b>' + esc(s.itemLabel || 'Item') + ' #' + (201 + i) + '</b>' + ph(180) + '</div><div class="q-actions">' + acts + '</div></li>';
      }
      body = '<ul class="queue-list">' + items + '</ul>';
    }
    return '<section class="card" data-callout="queue">' + tabRow + body + '</section>';
  }

  function formHtml(role, s, index) {
    var allowed = can(role, s.submit && s.submit.permission);
    var errors = state.formErrors[index] || {};
    var fields = (s.fields || []).map(function (f, fi) {
      var name = 'f' + index + '_' + fi;
      var dis = allowed ? '' : ' disabled';
      if (f.type === 'checkbox') return '<label class="check"><input type="checkbox" name="' + name + '"' + (f.value ? ' checked' : '') + dis + '> ' + esc(f.label) + '</label>';
      var control = f.type === 'select'
        ? '<select name="' + name + '"' + dis + '>' + (f.options || ['Option']).map(function (o) { return '<option>' + esc(o) + '</option>'; }).join('') + '</select>'
        : '<input name="' + name + '" type="' + esc(f.type || 'text') + '"' + (f.value != null ? ' value="' + esc(f.value) + '"' : '') + (f.type === 'number' ? ' step="any"' : '') + (f.required ? ' aria-required="true"' : '') + dis + '>';
      var msg = errors[fi] ? '<small class="err">' + esc(errors[fi]) + '</small>' : f.hint ? '<small>' + esc(f.hint) + '</small>' : '';
      return '<label class="field' + (errors[fi] ? ' invalid' : '') + '"><span>' + esc(f.label) + (f.required ? ' *' : '') + '</span>' + control + msg + '</label>';
    }).join('');
    var foot = allowed
      ? '<div class="form-foot"><button type="submit" class="btn primary">' + esc((s.submit && s.submit.label) || 'Save') + '</button><span class="small muted">* required</span></div>'
      : '<p class="small muted">Read only for this role.</p>';
    return '<section class="card" data-callout="form"><div class="card-head">' + esc(s.title || 'Form') + '</div>' +
      '<form class="form" data-form="' + index + '" novalidate>' + fields + foot + '</form></section>';
  }

  var whyCount = 0;
  function actionButton(role, a, subject) {
    if (!can(role, a.permission)) {
      // Disabled with the reason, never hidden without one: a control that vanishes looks like a bug.
      var who = rolesWith(a.permission);
      var whyId = 'wf-why-' + (whyCount += 1);
      return '<span class="act-off"><button type="button" class="btn' + (a.danger ? ' danger' : '') + '" aria-disabled="true" aria-describedby="' + whyId + '">' + esc(a.label) + '</button>' +
        '<small id="' + whyId + '">' + (who.length ? 'Needs ' + esc(who.join(' or ')) : 'No role may use this') + '</small></span>';
    }
    var confirm = a.confirm === true || (a.reason && !a.confirm) ? a.label + '? This is hard to undo.' : a.confirm || '';
    return '<button type="button" class="btn' + (a.danger ? ' danger' : '') + '" data-do="action" data-label="' + esc(a.label) + '" data-subject="' + esc(subject) + '" data-confirm="' + esc(confirm) + '"' + (a.reason ? ' data-reason="true"' : '') + '>' + esc(a.label) + '</button>';
  }

  function drawerHtml(role) {
    if (!state.drawer) return '';
    var d = state.drawer.def;
    var tabs = d.tabs && d.tabs.length ? d.tabs : ['Summary'];
    var tab = tabs[Math.min(state.drawerTab, tabs.length - 1)];
    var body = '';
    if (/location|map/i.test(tab)) {
      body = '<div class="wf-map-placeholder"><b>Full detail map region</b><span>Selected record coordinates: latitude / longitude</span><small>SCHEMATIC PLACEHOLDER, not a live map</small></div><div class="kv"><span>Location precision</span><b>Approximate zone representative</b></div><p class="note">The product keeps map pan/zoom, provider attribution, Expand map, and a text fallback if the map service fails. No exact customer address is assumed.</p>';
    } else if (/activity|history|timeline/i.test(tab)) {
      body = '<p class="note">Not run. This region will show source-labelled arrival, queue, assignment, service, transport/dropoff and available-again events. No timestamps are fabricated in this wireframe.</p>';
    } else if (/message|comment|note/i.test(tab)) {
      body = '<div class="kv"><span>Customer</span>' + ph(200) + '</div><div class="kv"><span>Staff</span>' + ph(170) + '</div><div class="filter">Write a reply</div>';
    } else {
      body = '<div class="kv"><span>Status</span><span><span class="status">' + esc(statusList(state.drawer.statuses)[0]) + '</span></span></div>' +
        ['Owner', 'Created', 'Updated', 'Reference'].map(function (k, i) { return '<div class="kv"><span>' + k + '</span>' + ph(120 + i * 25) + '</div>'; }).join('');
    }
    var actions = (d.actions || []).map(function (a) { return actionButton(role, a, state.drawer.rowId); }).join('');
    return '<aside class="drawer" data-callout="drawer" role="dialog" aria-label="' + esc((d.title || 'Detail') + ' ' + state.drawer.rowId) + '">' +
      '<div class="drawer-head"><div class="grow"><div class="small muted">' + esc(d.title || 'Detail') + '</div><b>' + esc(state.drawer.rowId) + '</b></div>' +
      '<button type="button" class="btn" data-do="close-drawer" id="wf-drawer-close">Close</button></div>' +
      '<div class="tabs" role="tablist" data-callout="tabs">' + tabs.map(function (t, i) {
        return '<button type="button" class="tab" role="tab" aria-selected="' + (t === tab) + '" data-do="drawer-tab" data-index="' + i + '">' + esc(t) + '</button>';
      }).join('') + '</div>' +
      '<div class="drawer-body">' + body + '</div>' +
      (actions ? '<div class="drawer-foot">' + actions + '</div>' : '') + '</aside>';
  }

  function dialogHtml() {
    if (!state.dialog) return '';
    return '<div class="backdrop"><div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="wf-dialog-title" data-callout="confirm-dialog">' +
      '<h2 id="wf-dialog-title">' + esc(state.dialog.label) + '</h2><p>' + esc(state.dialog.text) + '</p>' +
      (state.dialog.reason
        ? '<div class="field' + (state.dialog.error ? ' invalid' : '') + '"><label for="wf-reason"><span>Reason (required, at least 10 characters, stored with the decision)</span></label>' +
          '<textarea id="wf-reason" rows="3"' + (state.dialog.error ? ' aria-invalid="true" aria-describedby="wf-reason-err"' : '') + '>' + esc(state.dialog.reasonText) + '</textarea>' +
          (state.dialog.error ? '<small class="err" id="wf-reason-err">' + esc(state.dialog.error) + '</small>' : '') +
          '<small role="status">' + (state.dialog.armed ? 'Discard the typed reason? Press Escape again to discard it.' : '') + '</small></div>'
        : '') +
      '<div class="dialog-foot"><button type="button" class="btn" data-do="dialog-cancel" id="wf-dialog-cancel">Cancel</button>' +
      '<button type="button" class="btn primary' + (state.dialog.danger ? ' danger' : '') + '" data-do="dialog-ok">' + esc(state.dialog.label) + '</button></div></div></div>';
  }

  function toastHtml() {
    return state.toast ? '<div class="toast" role="status" data-callout="toast">' + esc(state.toast) + '</div>' : '';
  }

  // ---------------------------------------------------------------- callouts, legend, side panels

  function isVisible(el) {
    return el.getClientRects().length > 0 && getComputedStyle(el).visibility !== 'hidden';
  }

  function applyCallouts() {
    var visible = {};
    TERMS.forEach(function (t, i) {
      var nodes = app.querySelectorAll('[data-callout="' + t[0] + '"]');
      for (var n = 0; n < nodes.length; n += 1) {
        if (!isVisible(nodes[n])) continue;
        visible[t[0]] = true;
        if (state.callouts) {
          var badge = document.createElement('span');
          badge.className = 'callout';
          badge.setAttribute('aria-hidden', 'true');
          badge.textContent = String(i + 1);
          nodes[n].appendChild(badge);
        }
        break;
      }
    });
    return visible;
  }

  function renderLegend(visible) {
    legend.innerHTML = TERMS.map(function (t, i) {
      var on = Boolean(visible[t[0]]);
      return '<li data-term="' + t[0] + '" class="' + (on ? '' : 'off') + '"><span class="num">' + (i + 1) + '</span><div><b>' + esc(t[1]) + '</b>' +
        '<p>' + esc(t[2]) + '</p>' + (on ? '' : '<p class="hint">Not in this view. ' + esc(t[3]) + '</p>') + '</div></li>';
    }).join('');
  }

  function renderSidePanels() {
    document.getElementById('wf-name').textContent = config.appName;
    document.title = config.appName + ' wireframe';
    var head = '<tr><th scope="col">Area</th>' + config.roles.map(function (r) { return '<th scope="col">' + esc(r.label) + '</th>'; }).join('') + '</tr>';
    var rows = config.nav.map(function (n) {
      return '<tr><td>' + esc(n.label) + '</td>' + config.roles.map(function (r) { return '<td>' + (can(r, n.permission) ? 'yes' : 'no') + '</td>'; }).join('') + '</tr>';
    }).join('');
    // Actions too: "disabled" means the role sees the area but the action shows disabled with its reason.
    var actions = [];
    var seen = {};
    function addAction(area, areaPermission, a) {
      if (!a || !a.label || seen[area + '|' + a.label]) return;
      seen[area + '|' + a.label] = true;
      actions.push({ name: area + ': ' + a.label, areaPermission: areaPermission, permission: a.permission });
    }
    config.nav.forEach(function (n) {
      var page = config.pages[n.id] || {};
      (page.actions || []).forEach(function (a) { addAction(n.label, n.permission, a); });
      (page.sections || []).forEach(function (sec) {
        (sec.actions || []).forEach(function (a) { addAction(n.label, n.permission, a); });
        if (sec.submit) addAction(n.label, n.permission, sec.submit);
        var d = drawerDef(sec.drawer);
        if (d) (d.actions || []).forEach(function (a) { addAction((d.title || d.id) + ' drawer', n.permission, a); });
      });
    });
    if (actions.length) {
      rows += '<tr><th scope="rowgroup" colspan="' + (config.roles.length + 1) + '">Actions</th></tr>' + actions.map(function (a) {
        return '<tr><td>' + esc(a.name) + '</td>' + config.roles.map(function (r) {
          return '<td>' + (can(r, a.permission) ? 'yes' : can(r, a.areaPermission) ? 'disabled' : 'no') + '</td>';
        }).join('') + '</tr>';
      }).join('');
    }
    document.getElementById('wf-access').innerHTML = '<table class="wf-table"><thead>' + head + '</thead><tbody>' + rows + '</tbody></table>' +
      '<p class="small muted" style="margin-top:8px">Hiding is for clarity only. The server must check every permission too.</p>';
    document.getElementById('wf-ia').innerHTML = config.nav.map(function (n) {
      var page = config.pages[n.id] || { sections: [] };
      var parts = (page.sections || []).map(function (s) {
        if (s.type === 'kpis') return 'KPI cards (' + (s.items || []).map(function (k) {
          var target = k.link ? navById(k.link) : null;
          return k.label + (k.link ? ' opens ' + (target ? target.label : k.link) + (k.filter ? ' filtered by ' + filterText(k.filter) : '') : ', display only');
        }).join('; ') + ')';
        if (s.type === 'table') {
          var d = drawerDef(s.drawer);
          return 'data table (' + (s.columns || []).join(', ') + ')' +
            (s.statuses ? ', statuses: ' + s.statuses : '') + (s.paging === 'cursor' ? ', cursor paging' : '') +
            (d ? '; row opens drawer "' + (d.title || d.id) + '" with tabs ' + (d.tabs || []).join(', ') : '');
        }
        if (s.type === 'queue') return 'queue with tabs ' + (s.tabs || []).map(function (t) { return t.label; }).join(', ');
        if (s.type === 'form') return 'form "' + (s.title || '') + '" (' + (s.fields || []).map(function (f) { return f.label; }).join(', ') + ')';
        if (s.type === 'filters') return 'filter bar (' + (s.fields || []).join(', ') + ')';
        if (s.type === 'chart') return 'chart "' + (s.title || '') + '"';
        return s.type;
      });
      return '<li><b>' + esc(n.label) + '</b>' + (n.permission ? ' <span class="small">[' + esc(n.permission) + ']</span>' : '') + ': ' + esc(parts.join('; ') || 'no sections yet') + '</li>';
    }).join('');
    var roleSelect = document.getElementById('wf-role');
    roleSelect.innerHTML = config.roles.map(function (r) { return '<option value="' + esc(r.id) + '">' + esc(r.label) + '</option>'; }).join('') +
      '<option value="">No session</option>';
    roleSelect.value = state.role;
  }

  function fit() {
    var h = HEIGHTS[state.width] || 900;
    app.style.width = state.width + 'px';
    app.style.height = h + 'px';
    var avail = Math.max(200, stage.clientWidth);
    var scale = Math.min(1, avail / state.width);
    scaler.style.transform = 'scale(' + scale + ')';
    frame.style.width = Math.floor(state.width * scale) + 'px';
    frame.style.height = Math.ceil(h * scale) + 'px';
    sizeLabel.textContent = state.width + ' x ' + h + ' px' + (scale < 1 ? ', shown at ' + Math.round(scale * 100) + '%' : '') +
      (size() === 'sm' ? ': phone layout, navigation in an off-canvas drawer' : size() === 'md' ? ': tablet layout, sidebar as a rail' : ': desktop layout');
  }

  function showToast(text) {
    state.toast = text;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { state.toast = ''; render(); }, 4000);
  }

  // ---------------------------------------------------------------- events

  app.addEventListener('click', function (e) {
    var t = e.target.closest('[data-do]');
    if (!t || !app.contains(t)) return;
    var act = t.getAttribute('data-do');
    if (act === 'nav') {
      state.page = t.getAttribute('data-id');
      var drill = t.getAttribute('data-filter');
      state.filter = drill ? JSON.parse(drill) : null;
      state.navOpen = false;
      state.drawer = null;
      state.queueTab = 0;
      if (location.hash !== '#' + state.page) location.hash = state.page;
    } else if (act === 'menu') {
      state.navOpen = true;
      state.focusNext = '.nav-item';
    } else if (act === 'scrim') {
      if (state.drawer) closeDrawer(); else { state.navOpen = false; state.focusNext = '.menu-btn'; }
    } else if (act === 'collapse') {
      state.collapsed = !state.collapsed;
      state.focusNext = '.collapse-btn';
    } else if (act === 'open-row') {
      var key = t.getAttribute('data-key').split(':');
      var page = config.pages[state.page] || { sections: [] };
      var role = currentRole();
      var sections = (page.sections || []).filter(function (s) { return can(role, s.permission); });
      var sec = sections[Number(key[0])];
      state.drawer = { def: drawerDef(sec && sec.drawer) || { title: 'Detail', tabs: ['Summary'] }, rowId: t.getAttribute('data-rowid'), key: t.getAttribute('data-key'), statuses: sec && sec.statuses };
      state.drawerTab = 0;
      state.returnFocus = '[data-key="' + t.getAttribute('data-key') + '"]';
      state.focusNext = '#wf-drawer-close';
    } else if (act === 'close-drawer') {
      closeDrawer();
    } else if (act === 'drawer-tab') {
      state.drawerTab = Number(t.getAttribute('data-index'));
      state.focusNext = '.drawer [data-do="drawer-tab"][data-index="' + state.drawerTab + '"]';
    } else if (act === 'queue-tab') {
      state.queueTab = Number(t.getAttribute('data-index'));
      state.focusNext = '[data-do="queue-tab"][data-index="' + state.queueTab + '"]';
    } else if (act === 'action') {
      var label = t.getAttribute('data-label');
      var subject = t.getAttribute('data-subject');
      var confirmText = t.getAttribute('data-confirm');
      if (confirmText) {
        var needsReason = t.getAttribute('data-reason') === 'true';
        state.dialog = { label: label, text: confirmText, subject: subject, danger: t.classList.contains('danger'), reason: needsReason, reasonText: '', error: '', armed: false };
        state.focusNext = needsReason ? '#wf-reason' : '#wf-dialog-cancel';
      } else {
        showToast('Wireframe preview only: ' + label + '. No result or operational change.');
      }
    } else if (act === 'dialog-ok') {
      if (state.dialog.reason && state.dialog.reasonText.trim().length < 10) {
        state.dialog.error = 'Enter at least 10 characters.';
        state.focusNext = '#wf-reason';
      } else {
        showToast('Wireframe confirmation preview only. No real plan or state changed.');
        state.dialog = null;
      }
    } else if (act === 'clear-filter') {
      state.filter = null;
    } else if (act === 'dialog-cancel') {
      state.dialog = null;
    } else if (act === 'theme') {
      showToast('The real app toggles light and dark here.');
    } else {
      return;
    }
    render();
  });

  app.addEventListener('submit', function (e) {
    var form = e.target.closest('form[data-form]');
    if (!form) return;
    e.preventDefault();
    var index = Number(form.getAttribute('data-form'));
    var page = config.pages[state.page] || { sections: [] };
    var role = currentRole();
    var sec = (page.sections || []).filter(function (s) { return can(role, s.permission); })[index];
    var errors = {};
    (sec && sec.fields ? sec.fields : []).forEach(function (f, fi) {
      var input = form.querySelector('[name="f' + index + '_' + fi + '"]');
      if (f.required && input && String(input.value).trim() === '') errors[fi] = 'Required';
    });
    state.formErrors[index] = errors;
    if (Object.keys(errors).length === 0) showToast('Wireframe inputs only. No scenario result, save or operational change.');
    render();
    var firstInvalid = app.querySelector('.field.invalid input');
    if (firstInvalid) firstInvalid.focus();
  });

  app.addEventListener('input', function (e) {
    if (e.target.id === 'wf-reason' && state.dialog) {
      state.dialog.reasonText = e.target.value;
      state.dialog.armed = false;
    }
  });

  app.addEventListener('keydown', function (e) {
    var row = e.target.closest && e.target.closest('tr[data-do="open-row"]');
    if (row && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault();
      row.click();
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (state.dialog) {
        // Escape never drops a typed reason without asking: the first press asks, the second discards.
        if (state.dialog.reason && state.dialog.reasonText.trim() && !state.dialog.armed) {
          state.dialog.armed = true;
          state.focusNext = '#wf-reason';
        } else {
          state.dialog = null;
        }
        render();
      }
      else if (state.drawer) { closeDrawer(); render(); }
      else if (state.navOpen) { state.navOpen = false; state.focusNext = '.menu-btn'; render(); }
      return;
    }
    if (e.key === '/' && !e.ctrlKey && !e.metaKey && !e.altKey) {
      var el = document.activeElement;
      var typing = el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' || el.isContentEditable);
      var search = document.getElementById('wf-search');
      if (!typing && search) {
        e.preventDefault();
        search.focus();
      }
    }
  });

  function closeDrawer() {
    state.drawer = null;
    state.focusNext = state.returnFocus;
  }

  legend.addEventListener('mouseover', function (e) {
    var li = e.target.closest('li[data-term]');
    var term = li ? li.getAttribute('data-term') : '';
    app.querySelectorAll('.hl').forEach(function (n) { n.classList.remove('hl'); });
    if (term) app.querySelectorAll('[data-callout="' + term + '"]').forEach(function (n) { n.classList.add('hl'); });
  });
  legend.addEventListener('mouseleave', function () {
    app.querySelectorAll('.hl').forEach(function (n) { n.classList.remove('hl'); });
  });

  document.getElementById('wf-widths').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-width]');
    if (!b) return;
    state.width = Number(b.getAttribute('data-width'));
    state.collapsed = state.width >= 768 && state.width < 1200;
    state.navOpen = false;
    document.querySelectorAll('#wf-widths button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
    render();
  });
  document.getElementById('wf-role').addEventListener('change', function (e) {
    state.role = e.target.value;
    state.drawer = null;
    state.dialog = null;
    render();
  });
  document.getElementById('wf-data').addEventListener('change', function (e) {
    state.data = e.target.value;
    state.drawer = null;
    render();
  });
  document.getElementById('wf-callouts').addEventListener('change', function (e) {
    state.callouts = e.target.checked;
    render();
  });
  window.addEventListener('hashchange', function () {
    var id = location.hash.replace(/^#/, '');
    if (id && id !== state.page) { state.page = id; state.drawer = null; state.filter = null; render(); }
  });
  if (typeof ResizeObserver === 'function') new ResizeObserver(fit).observe(stage);
  else window.addEventListener('resize', fit);

  renderSidePanels();
  render();
})();
</script>
</body>
</html>
