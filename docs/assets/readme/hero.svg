      <path d="M874 562C998 425 916 371 983 329S1003 262 1049 248 1229 142 1314 75"/>
    </g>
    <path d="M757 386 790 330 849 311 886 246 959 226 1012 149 1123 142 1183 64" fill="none" stroke="#7aa1ad" stroke-width="13" opacity=".08" stroke-linecap="round" stroke-linejoin="round"/>
