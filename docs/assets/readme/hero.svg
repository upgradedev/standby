<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title description">
  <title id="title">Standby: see the capacity behind the coverage</title>
  <desc id="description">An original abstract road map with three assumed unit home sites accompanies the Standby name. Real road times, mixed fleets and paired what-if scenarios are the product themes. The map is an illustration, not GPS or a screenshot.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081421"/><stop offset="1" stop-color="#132b38"/></linearGradient>
    <linearGradient id="road" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#53c9d8"/><stop offset="1" stop-color="#bded9a"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#53c9d8" stop-opacity=".2"/><stop offset="1" stop-color="#53c9d8" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#c5edf0" opacity=".07"/></pattern>
    <clipPath id="clip"><rect width="1280" height="440" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
