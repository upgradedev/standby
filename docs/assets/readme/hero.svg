    <g fill="none" stroke="#53c9d8" opacity=".2"><circle cx="886" cy="246" r="69"/><circle cx="886" cy="246" r="94" stroke-dasharray="3 8"/><circle cx="1123" cy="142" r="57"/></g>
    <g font-family="Inter, Segoe UI, Arial, sans-serif">
      <g transform="translate(56 48)"><rect width="40" height="40" rx="11" fill="#53c9d8"/><path d="M10 29 19 12h11L21 29Z" fill="none" stroke="#081421" stroke-width="3"/><text x="56" y="25" font-size="13" font-weight="600" letter-spacing="2" fill="#a7c7ce">ROADSIDE CAPACITY PLANNING</text></g>
      <text x="52" y="196" fill="#f0f7fb" font-size="98" font-weight="650" letter-spacing="-4">Standby</text>
      <text x="57" y="245" fill="#d0e2e9" font-size="27">See the capacity behind the coverage.</text>
      <text x="57" y="282" fill="#8daab9" font-size="17">Compare where units wait and when they become free.</text>
